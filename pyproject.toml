[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxcpmane2"
version = "0.1.0"
description = "VoxCPM2 TTS runtime + HTTP server for Apple Neural Engine"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
readme = "README.md"


dependencies = [
    "coremltools==9.0",
    "numpy>=2",
    "safetensors>=0.4.0",
    "ml-dtypes>=0.5.0",
    "soundfile",
    "soxr>=1.0.0",
    "fastapi",
    "uvicorn",
    "aiofiles",
    "huggingface_hub",
    "sounddevice",
    "tqdm",
    "ftfy>=6.3.1",
    "inflect",
    "regex",
]

[project.optional-dependencies]
tokenizer = [
    "tokenizers>=0.23.1",
]
normalize = [
    "wetext",
]
nogil = [
    "tokenizers>=0.23.1",
    "pydub",
]
all = [
    "tokenizers>=0.23.1",
    "wetext",
    "pydub",
]

[project.urls]
Homepage = "https://github.com/0seba/VoxCPMANE"

[project.scripts]
voxcpmane2-server = "voxcpmane.server:main"
voxcpmane2-benchmark-overlap = "voxcpmane.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxcpmane"]
